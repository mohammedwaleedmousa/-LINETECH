<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="incoming" x1="300" y1="0" x2="975" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8bbaf5" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#b9d7ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f4f9ff" stop-opacity="0.72"/>
