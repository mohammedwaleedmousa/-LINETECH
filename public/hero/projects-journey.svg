<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="route" x1="700" y1="500" x2="1530" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EAF4FF" stop-opacity="0.10"/>
      <stop offset="0.14" stop-color="#BFD9FF" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#6CA8F8" stop-opacity="0.28"/>
    </linearGradient>
    <radialGradient id="originGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 520) rotate(90) scale(95 125)">
      <stop stop-color="#DCEBFF" stop-opacity="0.26"/>
      <stop offset="0.35" stop-color="#79AEF6" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#79AEF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <path id="journey" d="M660 535 C790 510 858 438 956 432 C1060 425 1128 482 1217 471 C1322 458 1389 394 1534 405"/>
  </defs>

  <ellipse cx="760" cy="520" rx="125" ry="95" fill="url(#originGlow)"/>

  <use href="#journey" stroke="url(#route)" stroke-width="1.55" stroke-linecap="round"/>
  <use href="#journey" stroke="#89B9F8" stroke-opacity="0.10" stroke-width="5" stroke-linecap="round" filter="url(#halo)"/>

  <g fill="#E9F4FF" stroke="#87B9F8" stroke-opacity="0.35">
    <circle cx="956" cy="432" r="3.6">
      <animate attributeName="r" values="3.2;4.8;3.2" dur="5.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="5.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1217" cy="471" r="3.6">
      <animate attributeName="r" values="3.2;4.8;3.2" dur="5.4s" begin="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="5.4s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1534" cy="405" r="3.6">
      <animate attributeName="r" values="3.2;4.8;3.2" dur="5.4s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;1;0.55" dur="5.4s" begin="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#78AEF7" opacity="0.16" filter="url(#halo)">
    <circle cx="956" cy="432" r="18"/>
    <circle cx="1217" cy="471" r="18"/>
    <circle cx="1534" cy="405" r="18"/>
  </g>

  <circle r="3.2" fill="#F8FBFF" filter="url(#soft)">
    <animateMotion dur="8.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#journey"/>
    </animateMotion>
  </circle>
</svg>