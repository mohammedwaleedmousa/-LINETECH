<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" preserveAspectRatio="xMidYMid slice">
  <!-- Content source: Terms — responsibilities from both sides align at an agreed scope and continue together toward handover. -->
  <defs>
    <linearGradient id="route" x1="760" y1="0" x2="1580" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8BBBF7" stop-opacity="0"/>
      <stop offset=".22" stop-color="#A8CDFF" stop-opacity=".22"/>
      <stop offset=".58" stop-color="#D9EAFF" stop-opacity=".62"/>
      <stop offset="1" stop-color="#6FAAF4" stop-opacity=".26"/>
    </linearGradient>
    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
