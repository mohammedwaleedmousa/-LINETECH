  <path d="M1160 448 C1300 448 1430 448 1570 448" stroke="url(#route)" stroke-width="1.35" stroke-linecap="round" opacity=".80"/>
  <path d="M1160 448 C1300 448 1430 448 1570 448" stroke="#ECF6FF" stroke-width="1.05" stroke-linecap="round" opacity=".34" stroke-dasharray="38 680">
