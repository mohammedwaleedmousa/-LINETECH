name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linetech-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Dependency security contract
        run: npm run test:deps

      - name: Localization contract
        run: npm run test:localization

      - name: Route contract
        run: npm run test:routes

      - name: Backend schema contract
        run: npm run test:backend

      - name: Auth route contract
        run: npm run test:auth

      - name: Worker syntax contract
        run: npm run test:worker

      - name: E2E contract
        run: npm run test:e2e-contract

      - name: Production build
        run: npm run build
