name: LINETECH QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linetech-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Build and production contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run dependency security contract
        run: npm run test:deps

      - name: Run localization contract
        run: npm run test:localization

      - name: Run route contract
        run: npm run test:routes

      - name: Run backend schema contract
        run: npm run test:backend

      - name: Run auth contract
        run: npm run test:auth

      - name: Run worker contract
        run: npm run test:worker

      - name: Run E2E contract
        run: npm run test:e2e-contract

      - name: Build production bundle
        run: npm run build
